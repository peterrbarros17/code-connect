services:
  postgres:
    image: postgres:17-alpine
    container_name: code-connect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-code_connect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-code_connect}
      POSTGRES_DB: ${POSTGRES_DB:-code_connect}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-code_connect} -d ${POSTGRES_DB:-code_connect}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
